schema_version: "1.1"
name: receipts-general
tags: [receipts]
plugins: ["../.."]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Today is September 25, 2026. Rough day. Show me my receipts from fieldnotes. I don't want to talk about it, just show me."
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?receipts"'
  - name: includes-recovery-arc
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply includes at least three of: a hard thing gotten through (CI failures in May resolved, or the
      July missed deadline turned into the completed migration), a then-vs-now growth arc (Architecture), a rough week
      followed by recovery (July engagement 3 back up to 7 or higher), and kudos from others, each tied to weeks.
      FAIL if it asks the user to explain what's wrong before showing evidence, or includes fewer than three of these.
  - name: no-file-by-default
    type: tool_used
    tool: Write
    min: 0
    max: 0
