schema_version: "1.1"
name: growth-pm
tags: [growth]
plugins: ["../.."]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Today is September 25, 2026. Show me my skill growth from my fieldnotes. Written report only."
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?growth"'
  - name: uses-custom-categories
    type: regex
    target: { source: file, path: reports/2026-09-25-growth.md }
    pattern: "Stakeholder Alignment"
  - name: notes-short-history
    type: regex
    target: { source: file, path: reports/2026-09-25-growth.md }
    pattern: "8 weeks|eight weeks|since (late )?July"
    flags: i
