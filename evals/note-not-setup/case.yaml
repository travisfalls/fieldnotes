schema_version: "1.1"
name: note-not-setup
tags: [note]
plugins: ["../.."]
execution:
  prompt: "/fieldnotes:note shipped the new onboarding doc"
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: points-to-setup
    type: regex
    target: last_message
    pattern: "setup"
    flags: i
  - name: no-files-created
    type: file_exists
    path: "**/*.md"
    exists: false
