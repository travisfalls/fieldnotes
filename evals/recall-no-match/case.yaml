schema_version: "1.1"
name: recall-no-match
tags: [recall]
plugins: ["../.."]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Search my fieldnotes: when did I work on Kubernetes autoscaling?"
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: admits-no-match
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply clearly says no entries mention Kubernetes autoscaling and does not claim the user worked on it.
      It may mention genuinely related entries (like DevOps or CI work) if it labels them as related rather than a match.
      FAIL if it states or implies the user worked on Kubernetes autoscaling in a specific week.
