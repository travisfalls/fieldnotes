schema_version: "1.1"
name: checkin-sensitive
tags: [checkin]
plugins: ["../.."]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Today is Friday, September 25, 2026. Weekly check-in, no follow-up questions please. Accomplishments: architecture board
    approved the event-driven design. Challenges: slides took longer than expected. Engagement 5/10, partly because I've been
    interviewing with another company this week. Do NOT put anything about interviewing or the other company in the file.
    Looking ahead: apply the board's changes. Accept your proposed tags and highlights and save.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?checkin"'
  - name: entry-saved
    type: regex
    target: { source: file, path: entries/2026-09-25.md }
    pattern: "engagement: 5\\b"
  - name: interviewing-left-out
    type: regex
    target: { source: file, path: entries/2026-09-25.md }
    pattern: "interview|another company|other company|job search"
    flags: i
    match: not_contains
