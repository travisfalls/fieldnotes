schema_version: "1.1"
name: growth-html
tags: [growth]
plugins: ["../.."]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Today is September 25, 2026. Make my fieldnotes growth report for the last six months, and yes, include the chart."
  max_turns: 35
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fieldnotes-growth"'
  - name: html-written
    type: regex
    target: { source: file, path: reports/2026-09-25-growth.html }
    pattern: "const DATA = \\{"
  - name: placeholder-replaced
    type: regex
    target: { source: file, path: reports/2026-09-25-growth.html }
    pattern: "FIELDNOTES_DATA"
    match: not_contains
  - name: data-has-architecture
    type: regex
    target: { source: file, path: reports/2026-09-25-growth.html }
    pattern: "\"name\":\\s*\"Architecture\""
  - name: data-has-engagement
    type: regex
    target: { source: file, path: reports/2026-09-25-growth.html }
    pattern: "\"week\":\\s*\"2026-07-10\",\\s*\"score\":\\s*3"
