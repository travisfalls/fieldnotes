schema_version: "1.1"
name: fixtures-smoke
description: Confirms scaffold scripts copy a fixture folder into the run workspace.
tags: [smoke]
plugins: ["../.."]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Read fieldnotes.yml in the current directory and reply with only the value of the name field."
  max_turns: 5
  allowed_tools: [Read, Glob]
graders:
  - name: name-read
    type: regex
    target: last_message
    pattern: "Jordan"
