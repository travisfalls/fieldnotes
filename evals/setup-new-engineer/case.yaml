schema_version: "1.1"
name: setup-new-engineer
tags: [setup]
plugins: ["../.."]
execution:
  prompt: >-
    I want to start using Fieldnotes. Put my folder at ./Fieldnotes in the current directory.
    My name is Alex. I'm a software engineer and I work as a consultant, so use both of those packs
    and keep the categories as they are. Remind me Fridays at 2pm with a calendar file. Don't ask me anything else, just set it up.
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?setup"'
  - name: config-exists
    type: regex
    target: { source: file, path: Fieldnotes/fieldnotes.yml }
    pattern: "schema: 1"
  - name: engineer-and-consultant-categories
    type: regex
    target: { source: file, path: Fieldnotes/fieldnotes.yml }
    pattern: "Architecture[\\s\\S]*Client Communication|Client Communication[\\s\\S]*Architecture"
  - name: role-packs-recorded
    type: regex
    target: { source: file, path: Fieldnotes/fieldnotes.yml }
    pattern: "software-engineer[\\s\\S]*consultant"
  - name: ics-friday
    type: regex
    target: { source: file, path: Fieldnotes/fieldnotes-reminder.ics }
    pattern: "RRULE:FREQ=WEEKLY;BYDAY=FR"
  - name: ics-2pm
    type: regex
    target: { source: file, path: Fieldnotes/fieldnotes-reminder.ics }
    pattern: "DTSTART:\\d{8}T140000"
  - name: privacy-note-shown
    type: regex
    target: trace
    pattern: "organization's settings may give admins access"
