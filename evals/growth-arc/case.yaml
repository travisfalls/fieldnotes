schema_version: "1.1"
name: growth-arc
tags: [growth]
plugins: ["../.."]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Today is September 25, 2026. Using my fieldnotes, how have my skills grown over the last six months? Just the written report, no chart."
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?growth"'
  - name: report-file
    type: regex
    target: { source: file, path: reports/2026-09-25-growth.md }
    pattern: "Architecture"
  - name: architecture-grew
    type: llm
    focus: { source: file, path: reports/2026-09-25-growth.md }
    criteria: |
      PASS if the report identifies Architecture as the area that grew most (from a first ADR as a learning in April to
      leading the event-driven redesign at strength 3 in August and September), cites weeks as evidence, and mentions
      the July engagement dip and recovery.
      FAIL if Architecture's growth isn't identified or no weeks are cited.
  - name: no-html-when-not-asked
    type: file_exists
    path: "reports/*.html"
    exists: false
