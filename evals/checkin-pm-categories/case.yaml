schema_version: "1.1"
name: checkin-pm-categories
tags: [checkin]
plugins: ["../.."]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Today is Friday, September 25, 2026. Do my weekly check-in, no follow-up questions. Accomplishments: reviewed the first
    week of payment reminder results with leadership and got approval to expand reminders to SMS. Challenges: support raised
    concerns about message volume. Engagement 7/10. Looking ahead: interview three customers about SMS preferences.
    Accept your proposed tags and highlights and save.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?checkin"'
  - name: uses-pm-categories
    type: regex
    target: { source: file, path: entries/2026-09-25.md }
    pattern: "category: \"?(Stakeholder Alignment|Product Analytics|Discovery|Launch|Roadmapping)\"?"
  - name: no-foreign-categories
    type: regex
    target: { source: file, path: entries/2026-09-25.md }
    pattern: "category: \"?(Architecture|Backend|Frontend|Stakeholder Management|Metrics & Analytics)\"?"
    match: not_contains
