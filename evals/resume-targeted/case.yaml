schema_version: "1.1"
name: resume-targeted
tags: [resume]
plugins: ["../.."]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Today is September 25, 2026. I'm applying for a staff engineer role focused on architecture. Pull resume bullets from my fieldnotes since May, tailored to that."
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fieldnotes-resume"'
  - name: leads-with-architecture
    type: llm
    focus: { source: file, path: reports/2026-09-25-resume.md }
    criteria: |
      PASS if the first bullets emphasize architecture and technical leadership (event-driven redesign, partitioning,
      design reviews, mentoring), and every week cited in the bullets is 2026-05-01 or later.
      FAIL if it leads with unrelated work, or cites any week of 2026-04-24 or earlier.
